openapi: 3.0.0
info:
  title: Practice Backend API
  version: 1.0.0
  description: REST API documentation for the study-backendToDevOp-practice project
servers:
  - url: http://localhost:3000
    description: Local Development Server

paths:
  /health:
    get:
      summary: Check server health status (Liveness probe)
      responses:
        '200':
          description: Server is running normally

  /ready:
    get:
      summary: Check readiness to serve traffic
      responses:
        '200':
          description: All dependencies are ready
        '503':
          description: Dependency connection error

  /api/auth/login:
    post:
      summary: System login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: user@gmail.com
                password:
                  type: string
                  minLength: 6
                  example: 123456
      responses:
        '200':
          description: Login successful
        '400':
          description: Input validation error or malformed JSON payload
        '500':
          description: Internal server error

  /api/auth/register:
    post:
      summary: Create an account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
                - profile
              properties:
                email:
                  type: string
                  format: email
                  example: user@gmail.com
                password:
                  type: string
                  minLength: 6
                  example: 123456
                profile:
                  type: object
                  required:
                    - fullName
                  properties:
                    fullName:
                      type: string
                      example: Dinh Van Ngoc Toan
                    phone:
                      type: string
                      example: 0123456789
                    avatar:
                      type: string
                      example: https://example.com/avatar.jpg
      responses:
        '201':
          description: Account created successfully
        '400':
          description: Input validation error
        '409':
          description: Account already exists
        '500':
          description: Internal server error
