name: CI/CD Pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout source code
        uses: actions/checkout@v4

      - name: 2. install pnpm
        uses: pnpm/action-setup@v4

      - name: 3. install node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: 4. install Dependencies
        run: pnpm install --frozen-lockfile

      - name: 5. build Monorepo contracts
        run: pnpm --filter @repo/contracts build

      - name: 6. check Type-check & Lint
        run: |
          pnpm exec tsc --noEmit
          pnpm lint

      - name: 7. run 100% test
        run: pnpm test

      - name: 8. login Docker hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 9. build and push docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/backend-practice:latest
